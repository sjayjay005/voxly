<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voxly — read a document</title>
<style>
  :root { --paper: #F5F6F2; --ink: #1E2230; --muted: #6A6F7E; --rule: #E2E4DD; --brand: #5B3DF5; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #16171B; --ink: #E6E5DF; --muted: #8E919B; --rule: #2A2C33; --brand: #8C74FF; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink);
         font: 400 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width: min(560px, 92vw); text-align: center; padding: 40px 0; }
  h1 { font: 700 28px/1.2 system-ui, sans-serif; letter-spacing: -.02em; margin: 0 0 10px; }
  p.lede { color: var(--muted); margin: 0 0 28px; }
  #drop { border: 2px dashed var(--rule); border-radius: 12px; padding: 44px 24px; transition: border-color .15s, background .15s; }
  #drop.over { border-color: var(--brand); background: color-mix(in srgb, var(--brand) 7%, transparent); }
  #drop p { margin: 0 0 16px; color: var(--muted); }
  button { font: 600 15px/1 inherit; color: #fff; background: var(--brand); border: 0; border-radius: 8px; padding: 12px 18px; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  #status { margin-top: 20px; color: var(--muted); min-height: 1.6em; }
  #status.error { color: #A32B37; }
  @media (prefers-color-scheme: dark) { #status.error { color: #E88A93; } }
  footer { margin-top: 28px; font-size: 13px; color: var(--muted); }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
</style>
</head>
<body>
<main>
  <h1>Read a document aloud</h1>
  <p class="lede">Open a PDF or an EPUB and Voxly reads it with the same reader, voices and word highlighting it uses on web pages.</p>
  <div id="drop">
    <p>Drop a PDF or EPUB here</p>
    <button id="pick" type="button">Choose a file</button>
    <input id="file" type="file" accept="application/pdf,.pdf,application/epub+zip,.epub">
  </div>
  <p id="status" role="status"></p>
  <footer>The file is read on this computer. Nothing is uploaded.</footer>
</main>

<!-- Classic scripts, shared with the content script, in dependency order. -->
<script src="../doc/model.js"></script>
<script src="../doc/tab-mark.js"></script>
<script src="../reader/view.js"></script>
<script src="../doc/session.js"></script>
<script src="pdf-layout.js"></script>
<!-- pdf.js is an ES module, so the glue is too. -->
<script type="module" src="viewer.js"></script>
</body>
</html>
